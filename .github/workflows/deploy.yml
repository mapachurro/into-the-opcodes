name: Deploy with Omnipin

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check static site
        run: test -f public/index.html

      - name: Install Omnipin
        run: |
          npm i -g omnipin@latest
          omnipin --version

      - name: Deploy the site
        run: omnipin deploy public --providers=Pinata --ens ${{ vars.OMNIPIN_ENS }}
        env:
          OMNIPIN_PINATA_TOKEN: ${{ secrets.OMNIPIN_PINATA_TOKEN }}
          OMNIPIN_PK: ${{ secrets.OMNIPIN_PK }}